<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Case Study</title>
    <style>
      :root {
        --bg: #f3efe4;
        --bg-alt: #eae3d0;
        --ink: #120d0f;
        --ink-soft: #4a3d3d;
        --rule: #b39a7a;
        --olive: #55613f;
        --olive-deep: #4d4431;
        --clay: #674452;
        --tone-about: #f2e1cf;
        --font-serif: "Newsreader", Georgia, "Times New Roman", serif;
        --font-sans: "Archivo", "Helvetica Neue", Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--font-sans);
        line-height: 1.7;
      }

      a {
        color: var(--clay);
        text-decoration: none;
      }

      a:hover,
      a:focus-visible {
        text-decoration: underline;
      }

      .page-shell {
        max-width: 1100px;
        margin: 0 auto;
        padding: 48px 20px 80px;
      }

      .back-link {
        display: inline-block;
        margin-bottom: 20px;
        font-size: 0.95rem;
        font-weight: 600;
      }

      .case-study-card {
        background: rgba(255, 255, 255, 0.16);
        border: 1px solid var(--rule);
        border-radius: 18px;
        padding: 36px;
        box-shadow: 0 10px 30px rgba(18, 13, 15, 0.04);
      }

      .case-study-header {
        display: grid;
        grid-template-columns: minmax(0, 2fr) minmax(180px, 280px);
        gap: 32px;
        align-items: center;
      }

      .eyebrow {
        display: inline-block;
        margin-bottom: 12px;
        font-size: 0.8rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--ink-soft);
      }

      h1 {
        margin: 0;
        font-family: var(--font-serif);
        font-size: clamp(2.2rem, 4vw, 4rem);
        line-height: 1.08;
      }

      .subtitle {
        margin: 14px 0 0;
        color: var(--ink-soft);
        font-size: 1rem;
      }

      .case-study-image {
        width: 100%;
        border-radius: 16px;
        overflow: hidden;
        border: 1px solid var(--rule);
        background: var(--tone-about);
      }

      .case-study-image img {
        display: block;
        width: 100%;
        height: 100%;
        min-height: 260px;
        object-fit: cover;
      }

      .tag-list {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 24px 0 30px;
      }

      .tag {
        display: inline-flex;
        align-items: center;
        padding: 6px 10px;
        border-radius: 999px;
        background: rgba(85, 97, 63, 0.12);
        border: 1px solid rgba(85, 97, 63, 0.25);
        color: var(--olive-deep);
        font-size: 0.8rem;
        font-weight: 600;
      }

      .body-copy {
        max-width: 760px;
      }

      .body-copy p {
        margin: 0 0 1.5rem;
        font-size: 1.06rem;
      }

      .footer-note {
        margin-top: 44px;
        padding-top: 22px;
        border-top: 1px solid var(--rule);
        font-size: 1.02rem;
      }

      @media (max-width: 760px) {
        .case-study-card {
          padding: 24px 18px;
        }

        .case-study-header {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="page-shell">
      <a class="back-link" href="index.html">← Back to the site</a>

      <article class="case-study-card" aria-live="polite">
        <header class="case-study-header">
          <div>
            <span class="eyebrow">Case study</span>
            <h1 id="case-study-title">Case study title</h1>
            <p class="subtitle" id="case-study-subtitle"></p>
          </div>
          <div class="case-study-image">
            <img id="case-study-image" src="" alt="" />
          </div>
        </header>

        <div class="tag-list" id="case-study-tags"></div>

        <div class="body-copy" id="case-study-body"></div>

        <p class="footer-note">
          Found this interesting? Read the full literature review
          <a id="literature-link" href="" target="_blank" rel="noopener">here</a>
        </p>
      </article>
    </main>

    <script src="content.js"></script>
    <script>
      (function () {
        "use strict";

        var allStudies = [];
        var caseStudiesSection =
          window.siteContent && window.siteContent.caseStudies;
        if (caseStudiesSection) {
          allStudies = (caseStudiesSection.items || []).concat(
            caseStudiesSection.archive || []
          );
        }

        var params = new URLSearchParams(window.location.search);
        var slug = params.get("slug");
        var study = allStudies.find(function (item) {
          return item.slug === slug;
        }) || allStudies[0];

        if (!study) {
          document.getElementById("case-study-title").textContent = "Case study";
          return;
        }

        var titleEl = document.getElementById("case-study-title");
        var subtitleEl = document.getElementById("case-study-subtitle");
        var bodyEl = document.getElementById("case-study-body");
        var tagsEl = document.getElementById("case-study-tags");
        var imageEl = document.getElementById("case-study-image");
        var literatureLink = document.getElementById("literature-link");

        titleEl.textContent = study.title;
        subtitleEl.textContent = study.meta || "";
        document.title = study.title + " | Simran Kriplani";

        if (study.photo) {
          imageEl.src = study.photo.src;
          imageEl.alt = study.photo.alt || study.title;
        } else {
          imageEl.removeAttribute("src");
          imageEl.alt = study.title;
        }

        (study.tags || []).forEach(function (tag) {
          var chip = document.createElement("span");
          chip.className = "tag";
          chip.textContent = tag;
          tagsEl.appendChild(chip);
        });

        (study.paragraphs || []).forEach(function (paragraph) {
          var p = document.createElement("p");
          p.textContent = paragraph;
          bodyEl.appendChild(p);
        });

        if (study.pdf && study.pdf.href) {
          literatureLink.href = study.pdf.href;
          literatureLink.setAttribute("title", study.pdf.label || "Open PDF");
        }
      })();
    </script>
  </body>
</html>
