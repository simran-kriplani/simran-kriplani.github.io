<!doctype html>
<html lang="en">
  <head>
    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-LNHWS6ZHRF"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-LNHWS6ZHRF");
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Archivo:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="js/theme-init.js"></script>
    <title>Blog post</title>
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/theme-dark.css" />
    <link rel="stylesheet" href="css/article.css" />
  </head>
  <body class="article-page article-page--post">
    <main class="page-shell">
      <a class="back-link" href="index.html#blog">← Back to the site</a>

      <article class="article" aria-live="polite">
        <span class="eyebrow">Blog post</span>
        <h1 id="blog-post-title">Blog post title</h1>
        <p class="subtitle" id="blog-post-subtitle"></p>

        <div class="post-body" id="blog-post-body"></div>

        <section class="comments" aria-label="Comments section">
          <h2>Thoughts</h2>
          <textarea
            id="comment-box"
            placeholder="Share your thoughts..."
          ></textarea>
          <div class="comment-actions">
            <button type="button" id="comment-submit">Post comment</button>
          </div>
          <ul class="comment-list" id="comment-list"></ul>
        </section>
      </article>
    </main>

    <script src="js/content.js"></script>
    <script src="js/blog-post.js"></script>
    <script src="js/comments.js"></script>
  </body>
</html>
