<html lang="en">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      Simran Kriplani — Consumer Strategy &amp; Behavioural Research
    </title>
    <meta
      name="description"
      content="Simran Kriplani studies consumer and market behaviour and turns those insights into branding, positioning, and strategy."
    />
    <script src="js/theme-init.js?v=dev"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Archivo:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/theme.css?v=dev" />
    <link rel="stylesheet" href="css/theme-dark.css?v=dev" />
    <link rel="stylesheet" href="css/site.css?v=dev" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="topbar">
      <a class="wordmark" href="#home">Simran Kriplani</a>
      <div class="topbar-actions">
        <nav id="primary-nav" aria-label="Primary">
          <a href="#home" data-nav data-page="home">Home</a>
          <a href="#case-studies" data-nav data-page="case-studies"
            >Case Studies</a
          >
          <a href="#blog" data-nav data-page="blog">Blog</a>
          <a href="#creative-space" data-nav data-page="creative-space"
            >Creative Space</a
          >
          <a href="#about" data-nav data-page="about">About</a>
          <a href="#contact" data-nav data-page="contact">Contact</a>
        </nav>
        <button
          class="theme-toggle"
          id="theme-toggle"
          type="button"
          aria-label="Switch to dark mode"
          title="Switch to dark mode"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              class="theme-toggle-sun"
              d="M12 2.5v2.3M12 19.2v2.3M4.7 4.7l1.6 1.6M17.7 17.7l1.6 1.6M2.5 12h2.3M19.2 12h2.3M4.7 19.3l1.6-1.6M17.7 6.3l1.6-1.6"
            />
            <circle class="theme-toggle-core" cx="12" cy="12" r="4.1" />
          </svg>
        </button>
        <button
          class="nav-toggle"
          id="nav-toggle"
          type="button"
          aria-label="Open menu"
          aria-controls="primary-nav"
          aria-expanded="false"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path class="nav-toggle-line" d="M4 7h16" />
            <path class="nav-toggle-line" d="M4 12h16" />
            <path class="nav-toggle-line" d="M4 17h16" />
          </svg>
        </button>
      </div>
    </header>

    <main id="main">
      <!-- ===================== HOME ===================== -->
      <section data-page="home" id="home">
        <div class="hero">
          <div class="hero-text">
            <h1 id="home-title"></h1>
            <p class="lede" id="home-lede"></p>
            <dl class="facts" id="home-facts"></dl>
            <div class="hero-actions">
              <a class="cta" id="home-cta" href="#contact"></a>
              <a
                class="cta cta-secondary"
                id="home-resume"
                href="assets/SimranKriplani_Resume.pdf"
                download
              ></a>
            </div>
          </div>
          <div class="hero-figure" id="hero-figure" aria-hidden="true">
            <svg viewBox="0 0 480 380" xmlns="http://www.w3.org/2000/svg">
              <rect class="curve-hit" width="480" height="380"></rect>
              <line class="axis-line" x1="20" y1="190" x2="460" y2="190"></line>
              <line class="axis-line" x1="240" y1="20" x2="240" y2="360"></line>
              <text class="axis-text" x="430" y="182">gains</text>
              <text class="axis-text" x="24" y="182">losses</text>
              <path
                class="value-curve"
                id="value-curve"
                d="M40,345 C160,320 200,260 240,190 C280,120 340,95 440,85"
              ></path>
              <g class="annot annot-1">
                <circle class="ref-dot" cx="240" cy="190" r="4"></circle>
                <line
                  class="annot-line"
                  x1="248"
                  y1="182"
                  x2="290"
                  y2="60"
                ></line>
                <text class="annot-text" x="292" y="57">reference point</text>
              </g>
              <g class="annot annot-2">
                <line
                  class="annot-line"
                  x1="195"
                  y1="255"
                  x2="120"
                  y2="230"
                ></line>
                <text class="annot-text" x="20" y="226">
                  steeper for losses
                </text>
              </g>
              <g class="annot annot-3">
                <line
                  class="annot-line"
                  x1="390"
                  y1="98"
                  x2="410"
                  y2="150"
                ></line>
                <text class="annot-text" x="330" y="165">
                  diminishing sensitivity
                </text>
              </g>
              <g class="curve-probe" id="curve-probe">
                <line
                  class="probe-guide"
                  id="probe-guide-x"
                  x1="240"
                  y1="190"
                ></line>
                <line
                  class="probe-guide"
                  id="probe-guide-y"
                  x1="240"
                  y1="190"
                ></line>
                <circle class="probe-dot" id="probe-dot" r="5.5"></circle>
              </g>
            </svg>
            <p class="curve-readout" id="curve-readout">
              Explore the curve: losses loom larger than gains.
            </p>
          </div>
        </div>

        <div class="featured section-block rule-top">
          <h2 id="featured-heading"></h2>
          <article class="featured-card" id="featured-card"></article>
          <div class="featured-controls" id="featured-controls">
            <button
              class="featured-nav-button"
              id="featured-prev"
              type="button"
              aria-label="Previous featured work"
            >
              ←
            </button>
            <span class="featured-count" id="featured-count"></span>
            <button
              class="featured-nav-button"
              id="featured-next"
              type="button"
              aria-label="Next featured work"
            >
              →
            </button>
          </div>
        </div>

        <div class="skills-preview section-block rule-top">
          <h2 id="skills-preview-heading"></h2>
          <div class="skills-preview-grid" id="skills-preview-grid"></div>
          <a id="skills-preview-link"></a>
        </div>
      </section>

      <!-- ===================== CASE STUDIES ===================== -->
      <section data-page="case-studies" id="case-studies">
        <h1 id="case-studies-title"></h1>
        <p class="section-intro" id="case-studies-intro"></p>

        <div id="case-studies-list"></div>

        <div class="research-strip">
          <h2 id="research-heading"></h2>
          <ul id="research-strip-list"></ul>
        </div>
      </section>

      <!-- ===================== TRY IT YOURSELF ===================== -->
      <section class="lab" id="try-it" aria-labelledby="lab-title">
        <div class="lab-card">
          <span class="lab-eyebrow" id="lab-eyebrow"></span>
          <h2 class="lab-title" id="lab-title"></h2>
          <p class="lab-intro" id="lab-intro"></p>
          <div class="lab-plans" id="lab-plans"></div>
          <div class="lab-result" id="lab-result" tabindex="-1" hidden></div>
        </div>
      </section>

      <!-- ===================== BLOG ===================== -->
      <section data-page="blog" id="blog">
        <h1 id="blog-title"></h1>
        <p class="section-intro" id="blog-intro"></p>
        <div class="blog-carousel">
          <div
            class="blog-carousel-viewport"
            id="blog-carousel-viewport"
            role="region"
            aria-label="Blog posts"
            tabindex="0"
          >
            <div class="blog-carousel-track" id="blog-list"></div>
          </div>
          <div class="blog-carousel-nav">
            <button
              class="carousel-arrow"
              id="blog-prev"
              aria-controls="blog-carousel-viewport"
              type="button"
              aria-label="Previous posts"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M14.5 5.5 8 12l6.5 6.5" />
              </svg>
            </button>
            <button
              class="carousel-arrow"
              id="blog-next"
              aria-controls="blog-carousel-viewport"
              type="button"
              aria-label="Next posts"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M9.5 5.5 16 12l-6.5 6.5" />
              </svg>
            </button>
          </div>
        </div>
        <div class="research-strip blog-strip" aria-live="polite">
          <h2 id="blog-archive-heading"></h2>
          <ul id="blog-archive-list"></ul>
        </div>
      </section>

      <!-- ===================== CREATIVE SPACE ===================== -->
      <section data-page="creative-space" id="creative-space">
        <h1 id="creative-space-title"></h1>
        <p class="section-intro" id="creative-space-intro"></p>
        <div class="feature-list" id="creative-space-list"></div>
      </section>

      <!-- ===================== ABOUT ===================== -->
      <section data-page="about" id="about">
        <h1 id="about-title"></h1>
        <div class="about-intro">
          <div class="headshot">
            <img
              src="assets/images/headshot.png"
              alt="Simran Kriplani"
              loading="lazy"
              decoding="async"
            />
          </div>
          <p class="bio" id="about-bio"></p>
        </div>
        <div class="section-block rule-top" id="about-education"></div>
        <div class="section-block rule-top" id="about-experience"></div>
        <div class="section-block rule-top" id="about-skills">
          <h2 id="about-skills-heading"></h2>
          <div class="skills-full-grid" id="skills-full-grid"></div>
        </div>
        <div class="section-block rule-top" id="about-leadership"></div>
      </section>

      <!-- ===================== CONTACT ===================== -->
      <section data-page="contact" id="contact">
        <h1 id="contact-title"></h1>
        <p class="contact-lede" id="contact-lede"></p>
        <ul class="contact-list" id="contact-list"></ul>
      </section>
    </main>

    <footer>
      <p id="footer-name"></p>
      <p id="footer-updated"></p>
    </footer>

    <script src="js/content.js?v=dev"></script>
    <script src="js/icons.js?v=dev"></script>
    <script src="js/site.js?v=dev"></script>
    <script src="js/experiment.js?v=dev"></script>
  </body>
</html>
