      /* ---------- Featured / cards ---------- */

      /* ---------- Tags ---------- */

        color: var(--ink-soft);

      /* ---------- Contact ---------- */

      }
      .contact-list li {
        border-top: 1px solid var(--rule);

      }
      .contact-sub {
        display: block;
        font-family: var(--font-sans);
        font-weight: 400;
        font-size: 0.85rem;
        color: var(--ink-soft);
        margin-top: 0.15rem;
      }

      /* ---------- Footer ---------- */
      footer {
        border-top: 1px solid var(--rule);
        padding: 1.8rem 1.5rem;
        max-width: var(--max-wide);
        margin: 0 auto;
        font-size: 0.85rem;
        color: var(--ink-soft);
        display: flex;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 0.6rem;
      }

      [hidden] {
        display: none !important;
      }
    </style>

    <script type="text/plain" data-legacy-renderer>
       (function () {
         "use strict";

         /* =========================================================
      DATA
      To add a new case study, push a new object into caseStudies.
      To add a new skill, push into the relevant category's tags.
      To add a new archive item, push into researchArchive.
      ========================================================= */

         var skillCategories = [
           {
             name: "Consumer insights",
             tags: [
               "Consumer behavior analysis",
               "Qualitative & quantitative research",
               "Customer journey mapping",
               "Questionnaire design",
               "Survey design",
             ],
           },
           {
             name: "Data & quantitative",
             tags: [
               "Statistical analysis",
               "Econometrics",
               "Quantitative reasoning",
             ],
           },
           {
             name: "Strategy & communication",
             tags: [
               "Client-ready presentations",
               "Research summaries",
               "Campaign & content strategy",
             ],
           },
           {
             name: "Tools",
             tags: [
               "Generative AI",
               "Tableau / Power BI",
               "SQL",
               "Excel",
               "Python",
             ],
           },
           {
             name: "Ethics & compliance",
             tags: [
               "TCPS 2: CORE 2022",
               "Good Clinical Practice (GCP)",
               "Responsible Conduct of Research (RCR)",
             ],
           },
         ];

         var caseStudies = [
           {
             slug: "grocery-oligopoly",
             title:
               "A Consumer Behaviour Perspective on Canada's Grocery Oligopoly",
             meta: "Independent research project · University of Toronto",
             paragraphs: [
               "Canada's grocery sector is dominated by a small number of conglomerates that each operate multiple retail banners spanning discount, mid-market, and premium tiers. That structure lets a single company appear to compete with itself while still controlling most of the shelf space a shopper actually sees.",
               "I processed multi-brand retail datasets in Python and Excel to trace how pricing moved across banners and time periods, and mapped the results against shifts in market share among the major players.",
               "The patterns pointed to a deliberate multi-brand strategy: premium banners protect margin while discount banners defend share, with pricing moving in tandem across the portfolio rather than banner by banner. I translated those findings into a customer strategy and positioning framework, then built a client-ready executive presentation framing the commercial and economic implications for retail stakeholders.",
             ],
             tags: [
               "Quantitative analysis",
               "Pricing strategy",
               "Market structure",
               "Executive presentations",
               "Python & Excel",
             ],
           },
           {
             slug: "brand-anthropomorphism",
             title: "Consumer Judgment & Brand Anthropomorphism Research",
             meta: "Research Assistant · UofT Dept. of Management",
             paragraphs: [
               "Consumers increasingly form judgments about brands that behave like people — including AI systems introduced as assistants, agents, or advisors. Understanding when that framing builds trust, and when it backfires, has real implications for how companies design and position AI-driven products.",
               "Working under Dr. Pankaj Aggarwal, I combined generative AI research tools with academic databases to synthesize more than 220 articles spanning consumer judgment, AI role framing, and brand anthropomorphism, cutting research synthesis time by roughly 40%. From there, I applied structured problem-solving frameworks to model how consumers form authenticity judgments and the heuristics they use to decide who, or what, to trust.",
               "The work became a 10-page research manuscript and an SSHRC-style grant proposal, both built to hold up to academic scrutiny while staying legible to a non-specialist reader.",
             ],
             tags: [
               "Literature synthesis",
               "GenAI-assisted research",
               "Behavioural frameworks",
               "Academic & technical writing",
             ],
           },
           {
             slug: "campus-leadership",
             title: "Applied Behavioural Strategy in Campus Leadership",
             meta: "SYNAPSE UofT · Psychological Health Society",
             paragraphs: [
               "Two campus organizations gave me a testing ground for behavioural strategy outside the lab: one focused on making neuroscience accessible to a broad student audience, the other on encouraging students to take mental health seriously.",
               "As Vice President of Communications at SYNAPSE, I led a team that designed and ran campaigns applying behavioural principles — like shortening the distance between interest and action — to drive engagement and knowledge retention. As Director of Marketing at the Psychological Health Society, I built social campaigns that used behavioural insight to normalize help-seeking and encourage small, sustainable habit change rather than one-off calls to action.",
               "Across both, the throughline was the same: a consistent brand voice and a real content strategy do more for behaviour change than any single clever post.",
             ],
             tags: [
               "Campaign strategy",
               "Content strategy",
               "Behavioural design",
               "Brand voice",
             ],
           },
         ];

         var researchArchive = [
           {
             title: "Integrative Research Poster",
             blurb:
               "Designed a research proposal on microfluidic technology for scalable, customizable lab-grown meat production, and presented it at a conference-style session.",
           },
           {
             title: "Ecology & Evolutionary Biology Lab",
             blurb:
               "Modeled population genetics and biodiversity datasets in Python, R, and SQL, automating data cleaning pipelines and building visual trend models.",
           },
           {
             title: "Multimedia Documentary Project",
             blurb:
               "Wrote and produced a documentary-style video on viral hijacking of host metabolism, translating dense science into audience-centered storytelling.",
           },
           {
             title: "Travel Video Project",
             blurb:
               "Directed and produced \u201cFrom City to Sanctuary,\u201d a short film through the Ma Moosh Ka Win Valley Trail.",
           },
         ];

         /* =========================================================
      RENDERERS
      ========================================================= */

         function el(tag, className, text) {
           var e = document.createElement(tag);
           if (className) e.className = className;
           if (text !== undefined) e.textContent = text;
           return e;
         }

         function renderSkillsPreview() {
           var wrap = document.getElementById("skills-preview-grid");
           skillCategories.forEach(function (cat) {
             var col = el("div");
             col.appendChild(el("h3", null, cat.name));
             col.appendChild(
               el(
                 "p",
                 null,
                 cat.tags.slice(0, 3).join(", ") +
                   (cat.tags.length > 3 ? ", \u2026" : ""),
               ),
             );
             wrap.appendChild(col);
           });
         }

         function renderSkillsFull() {
           var wrap = document.getElementById("skills-full-grid");
           skillCategories.forEach(function (cat) {
             var col = el("div");
             col.appendChild(el("h3", null, cat.name));
             var tagWrap = el("div");
             cat.tags.forEach(function (tag) {
               tagWrap.appendChild(el("span", "tag", tag));
             });
             col.appendChild(tagWrap);
             wrap.appendChild(col);
           });
         }

         function renderCaseStudies() {
           var wrap = document.getElementById("case-studies-list");
           caseStudies.forEach(function (cs) {
             var details = document.createElement("details");
             details.className = "case-study";
             details.id = cs.slug;

             var summary = document.createElement("summary");
             var left = el("span", "case-title", cs.title);
             var right = el("span", "case-meta", cs.meta);
             var toggle = el("span", "case-toggle");
             right.appendChild(toggle);
             summary.appendChild(left);
             summary.appendChild(right);
             details.appendChild(summary);

             var body = el("div", "case-body");
             cs.paragraphs.forEach(function (p) {
               body.appendChild(el("p", null, p));
             });
             var tagWrap = el("div");
             cs.tags.forEach(function (t) {
               tagWrap.appendChild(el("span", "tag", t));
             });
             body.appendChild(tagWrap);
             details.appendChild(body);

             wrap.appendChild(details);
           });
         }

         function renderResearchArchive() {
           var wrap = document.getElementById("research-strip-list");
           researchArchive.forEach(function (item) {
             var li = document.createElement("li");
             var strong = el("strong", null, item.title + ". ");
             li.appendChild(strong);
             li.appendChild(document.createTextNode(item.blurb));
             wrap.appendChild(li);
           });
         }

         renderSkillsPreview();
         renderSkillsFull();
         renderCaseStudies();
         renderResearchArchive();

         /* =========================================================
      SCROLL SPY
      All sections live on one continuous page. Nav links are
      plain anchors to section ids; this just keeps the nav's
      "current" underline in sync with whatever is on screen,
      and opens a case study if the URL deep-links to one
      (e.g. #case-studies:grocery-oligopoly).
      ========================================================= */

         var sections = Array.prototype.slice.call(
           document.querySelectorAll("main > section[data-page]"),
         );
         var navLinks = Array.prototype.slice.call(
           document.querySelectorAll("nav a[data-nav]"),
         );

         function setCurrent(page) {
           navLinks.forEach(function (a) {
             if (a.getAttribute("data-page") === page) {
               a.setAttribute("aria-current", "page");
             } else {
               a.removeAttribute("aria-current");
             }
           });
         }

         if ("IntersectionObserver" in window) {
           var observer = new IntersectionObserver(
             function (entries) {
               entries.forEach(function (entry) {
                 if (entry.isIntersecting) {
                   setCurrent(entry.target.getAttribute("data-page"));
                 }
               });
             },
             { rootMargin: "-45% 0px -50% 0px", threshold: 0 },
           );
           sections.forEach(function (sec) {
             observer.observe(sec);
           });
         }

         function openDeepLink() {
           var raw = (location.hash || "").replace("#", "");
           var parts = raw.split(":");
           var page = parts[0];
           var target = parts[1];
           if (page === "case-studies" && target) {
             var d = document.getElementById(target);
             if (d) {
               d.open = true;
               window.requestAnimationFrame(function () {
                 d.scrollIntoView({ block: "start" });
               });
             }
           }
         }

         window.addEventListener("hashchange", openDeepLink);
         openDeepLink();
         setCurrent(
           (location.hash || "#home").replace("#", "").split(":")[0] || "home",
         );
       })();
    </script>
    <script src="content.js"></script>
    <script src="site.js"></script>
  </body>
</html>
