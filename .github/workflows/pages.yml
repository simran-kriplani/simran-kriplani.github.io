# Deploys the static site (repository root) to GitHub Pages.
name: Deploy site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let an in-progress production deploy finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Cache-bust local CSS/JS: "?v=dev" becomes the commit hash, so browsers
      # never pair a freshly deployed page with stale cached scripts or styles.
      - name: Version asset URLs
        run: sed -i "s/?v=dev/?v=${GITHUB_SHA::8}/g" $(git ls-files '*.html')
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
